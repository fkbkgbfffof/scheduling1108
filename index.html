<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Online Scheduling App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  overflow-x:hidden;
  background:#080808;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    Arial,
    sans-serif;

  transition:
    background .45s ease,
    color .45s ease;
}

button{
  font-family:inherit;
  border:none;
}

/* =========================
   DYNAMIC THEMES
========================= */

body.theme-black{
  background:#080808;
  color:#fff;
}

body.theme-red{
  background:#d90024;
  color:#fff;
}

body.theme-white{
  background:#f7f7f7;
  color:#0b0b0b;
}


/* =========================
   MAIN
========================= */

.app{
  width:100%;
  min-height:100dvh;

  padding:
    calc(25px + env(safe-area-inset-top))
    15px
    calc(25px + env(safe-area-inset-bottom));

  transition:background .45s ease;
}


/* =========================
   TITLE
========================= */

.app-title{
  text-align:center;

  font-size:23px;
  line-height:1.1;

  font-weight:900;

  letter-spacing:-.7px;

  margin-top:2px;

  margin-bottom:42px;

  color:#fff;

  transition:
    color .4s ease,
    transform .4s ease;
}

.theme-white .app-title{
  color:#080808;
}

.theme-red .app-title{
  color:#fff;
}


/* =========================
   CALENDAR CARD
========================= */

.calendar-card{
  width:100%;

  padding:16px;

  border-radius:25px;

  background:#111;

  border:1px solid #292929;

  box-shadow:
    0 25px 70px rgba(0,0,0,.45);

  transition:
    background .45s ease,
    border-color .45s ease,
    box-shadow .45s ease,
    transform .45s ease;
}

.theme-red .calendar-card{
  background:#080808;
  border-color:#080808;

  box-shadow:
    0 25px 70px rgba(0,0,0,.35);
}

.theme-white .calendar-card{
  background:#fff;
  border-color:#ddd;

  box-shadow:
    0 25px 70px rgba(0,0,0,.13);
}


/* =========================
   MONTH
========================= */

.month-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.month-title{
  font-size:21px;
  font-weight:850;
  letter-spacing:-.4px;
}

.theme-white .month-title{
  color:#111;
}

.nav-button{
  width:38px;
  height:38px;

  border-radius:50%;

  background:#191919;

  border:1px solid #292929;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;

  transition:.25s;
}

.nav-button:active{
  transform:scale(.9);
  background:#ff1738;
}

.theme-white .nav-button{
  background:#f1f1f1;
  color:#111;
  border-color:#ddd;
}


/* =========================
   WEEKDAYS
========================= */

.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;

  margin-bottom:7px;
}

.weekday{
  text-align:center;

  color:#666;

  font-size:9px;
  font-weight:800;
}

.theme-red .weekday{
  color:#888;
}

.theme-white .weekday{
  color:#999;
}


/* =========================
   CALENDAR GRID
========================= */

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}


/* =========================
   DAY
========================= */

.day{
  position:relative;

  min-width:0;

  aspect-ratio:1 / 1.08;

  border-radius:14px;

  border:1px solid #272727;

  background:#151515;

  overflow:hidden;

  cursor:pointer;

  transition:
    transform .16s,
    border-color .25s,
    background .4s;
}

.day:active{
  transform:scale(.92);
}

.theme-white .day{
  background:#f5f5f5;
  border-color:#ddd;
}

.day.empty{
  opacity:0;
  pointer-events:none;
}

.day-number{
  position:absolute;

  z-index:5;

  top:7px;
  left:8px;

  font-size:10px;
  font-weight:800;

  color:#aaa;
}

.theme-white .day-number{
  color:#555;
}


/* =========================
   BOOKED DAY
========================= */

.day.booked{
  border-color:#4a151e;
  background:#18090d;
}

.day-photo{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.day.booked:after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0) 35%,
      rgba(0,0,0,.78) 100%
    );
}

.day-girl-name{
  position:absolute;

  z-index:6;

  left:7px;
  right:5px;
  bottom:6px;

  color:#fff;

  font-size:8px;
  font-weight:850;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.red-line{
  position:absolute;

  z-index:7;

  left:6px;
  right:6px;
  bottom:3px;

  height:2px;

  border-radius:5px;

  background:#ff1738;

  box-shadow:
    0 0 8px rgba(255,23,56,.7);
}


/* =========================
   FULL SCREEN PANELS
========================= */

.screen{
  position:fixed;

  z-index:100;

  inset:0;

  width:100%;
  height:100dvh;

  padding:
    calc(22px + env(safe-area-inset-top))
    16px
    calc(24px + env(safe-area-inset-bottom));

  overflow-y:auto;

  opacity:0;
  pointer-events:none;

  transform:translateY(25px);

  transition:
    opacity .3s ease,
    transform .35s ease,
    background .45s ease,
    color .45s ease;
}

.screen.open{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

#girlsScreen{
  background:#d90024;
}

#timeScreen{
  background:#080808;
}

#detailScreen{
  background:#f7f7f7;
  color:#111;
}


/* =========================
   SCREEN HEADER
========================= */

.screen-header{
  display:flex;
  align-items:center;

  gap:12px;

  margin-bottom:27px;
}

.back{
  width:41px;
  height:41px;

  flex:0 0 41px;

  border-radius:50%;

  background:rgba(0,0,0,.22);

  color:#fff;

  font-size:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.back:active{
  transform:scale(.88);
}

.screen-title{
  font-size:25px;
  font-weight:900;

  letter-spacing:-.6px;
}

.screen-subtitle{
  margin-top:4px;

  opacity:.6;

  font-size:11px;
}


/* =========================
   GIRLS
========================= */

.girls{
  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:11px;
}

.girl-card{
  position:relative;

  height:320px;

  border-radius:23px;

  overflow:hidden;

  border:2px solid rgba(255,255,255,.25);

  background:#111;

  cursor:pointer;

  transition:
    transform .15s,
    border-color .2s;
}

.girl-card:active{
  transform:scale(.96);
}

.girl-card.selected{
  border-color:#fff;

  box-shadow:
    0 0 0 4px rgba(255,255,255,.16);
}

.girl-photo{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.girl-card:after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,.8) 100%
    );
}

.girl-info{
  position:absolute;

  z-index:4;

  left:13px;
  bottom:14px;
}

.girl-name{
  font-size:19px;
  font-weight:900;
}

.selected-mark{
  position:absolute;

  z-index:10;

  top:11px;
  right:11px;

  width:31px;
  height:31px;

  border-radius:50%;

  background:#fff;
  color:#d90024;

  display:none;

  align-items:center;
  justify-content:center;

  font-weight:900;
}

.girl-card.selected .selected-mark{
  display:flex;
}


/* =========================
   TIME
========================= */

.time-list{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;
}

.time-button{
  height:55px;

  border-radius:16px;

  background:#151515;

  border:1px solid #292929;

  color:#fff;

  font-size:13px;
  font-weight:800;

  transition:.18s;
}

.time-button:active{
  transform:scale(.95);
}

.time-button.selected{
  background:#ff1738;
  border-color:#ff1738;
}


/* =========================
   GET INSIGHTS
========================= */

.confirm{
  width:100%;

  height:59px;

  margin-top:20px;

  border-radius:18px;

  background:#ff1738;

  color:#fff;

  font-size:14px;
  font-weight:900;

  letter-spacing:.5px;

  box-shadow:
    0 13px 35px rgba(255,23,56,.28);

  opacity:.35;

  pointer-events:none;

  transition:
    opacity .2s,
    transform .2s;
}

.confirm.ready{
  opacity:1;
  pointer-events:auto;
}

.confirm:active{
  transform:scale(.98);
}


/* =========================
   DETAIL
========================= */

#detailScreen .screen-title{
  color:#111;
}

#detailScreen .back{
  background:#111;
}

.detail{
  display:flex;
  flex-direction:column;

  align-items:center;

  text-align:center;
}

.detail-photo{
  width:225px;
  height:285px;

  border-radius:25px;

  object-fit:cover;

  border:1px solid #ddd;

  box-shadow:
    0 22px 55px rgba(0,0,0,.25);
}

.detail-name{
  margin-top:18px;

  font-size:27px;
  font-weight:900;
}

.detail-time{
  margin-top:8px;

  color:#e00028;

  font-size:16px;
  font-weight:900;
}

.detail-date{
  margin-top:6px;

  color:#777;

  font-size:12px;
}

.close-screen{
  width:100%;
  height:55px;

  margin-top:26px;

  border-radius:17px;

  background:#111;

  color:#fff;

  font-weight:800;
}


/* =========================
   CONFETTI
========================= */

#confetti{
  position:fixed;

  inset:0;

  z-index:999;

  pointer-events:none;

  overflow:hidden;
}

.confetti-piece{
  position:absolute;

  top:-25px;

  width:8px;
  height:15px;

  opacity:1;

  animation:
    confetti-fall
    var(--duration)
    cubic-bezier(.12,.72,.25,1)
    forwards;

  transform:
    rotate(var(--rotation));
}

@keyframes confetti-fall{

  0%{
    transform:
      translate3d(0,0,0)
      rotate(0deg);

    opacity:1;
  }

  100%{
    transform:
      translate3d(
        var(--x),
        110vh,
        0
      )
      rotate(var(--spin));

    opacity:0;
  }

}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:360px){

  .app-title{
    font-size:20px;
    margin-bottom:36px;
  }

  .calendar-card{
    padding:12px;
  }

  .calendar-grid{
    gap:4px;
  }

  .day{
    border-radius:11px;
  }

  .girl-card{
    height:275px;
  }

}
</style>
</head>

<body class="theme-black">

<div id="confetti"></div>


<!-- =========================
     MAIN CALENDAR
========================= -->

<main class="app">

  <div class="app-title">
    Online Scheduling App
  </div>

  <section class="calendar-card">

    <div class="month-nav">

      <button
        class="nav-button"
        id="prevMonth"

    <div

<!-- =========================

  <div

  >

    <div

      <img

        src="https://i.ibb.co/SXXFXs0z/10.jpg"

  <button

<!-- =========================

<section

  </div>


  <button

<!-- =========================

========================= -->

<section
  class="screen"
  id="detailScreen"
>

  <div class="screen-header">

    <button
      class="back"
      id="backFromDetail"
    >‹</button>

    <div class="screen-title">
      Meeting
    </div>

  </div>


  <div class="detail">

    <img
      class="detail-photo"
      id="detailPhoto"
      src=""
      alt=""
    >

    <div
      class="detail-name"
      id="detailName"
    ></div>

    <div
      class="detail-time"
      id="detailTime"
    ></div>

    <div
      class="detail-date"

    ></div>

  </div>


  <button
    class="close-screen"
    id="closeDetail"
  >
    BACK TO CALENDAR
  </button>

</section>


<script>

/* =========================
   DATA
========================= */

const bookedGirls = [

  {
    name:"Sonya",
    photo:"https://i.ibb.co/5hy8NkgM/8.jpg"
  },

  {
    name:"Jessica",
    photo:"https://i.ibb.co/FLPpwmDF/Melike-Sayg-n.jpg"
  },

  {
    name:"Melania",
    photo:"https://i.ibb.co/Z6KcqFbR/9.jpg"
  }

];

const meetingTimes = [
  "10:00 AM",
  "11:30 AM",
  "1:00 PM",
  "2:30 PM",
  "4:00 PM",
  "5:30 PM",
  "7:00 PM",
  "8:30 PM"
];


/* =========================
   ELEMENTS
========================= */

const calendarGrid =
  document.getElementById("calendarGrid");

const monthTitle =
  document.getElementById("monthTitle");

const prevMonth =
  document.getElementById("prevMonth");

const nextMonth =
  document.getElementById("nextMonth");

const girlsScreen =
  document.getElementById("girlsScreen");

const timeScreen =
  document.getElementById("timeScreen");

const detailScreen =
  document.getElementById("detailScreen");

const availableDate =
  document.getElementById("availableDate");

const selectedGirlName =
  document.getElementById("selectedGirlName");

const chooseGirlButton =
  document.getElementById("chooseGirlButton");

const confirmMeeting =
  document.getElementById("confirmMeeting");

const detailPhoto =
  document.getElementById("detailPhoto");

const detailName =
  document.getElementById("detailName");

const detailTime =
  document.getElementById("detailTime");

const detailDate =
  document.getElementById("detailDate");


/* =========================
   STATE
========================= */

let currentDate = new Date();

let currentMonth =
  currentDate.getMonth();

let currentYear =
  currentDate.getFullYear();

let selectedDate = null;
let selectedGirl = null;
let selectedTime = null;

const bookedDates = {};


/* =========================
   MONTHS
========================= */

const months = [
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"
];


/* =========================
   THEME
========================= */

function changeTheme(theme){

  document.body.classList.remove(
    "theme-black",
    "theme-red",
    "theme-white"
  );

  document.body.classList.add(
    "theme-" + theme
  );

}


/* =========================
   RANDOM BOOKINGS
========================= */

function generateBookedDates(){

  const key =
    currentYear + "-" + currentMonth;

  if(bookedDates[key]){
    return bookedDates[key];
  }

  const totalDays =
    new Date(
      currentYear,
      currentMonth + 1,
      0
    ).getDate();

  const today = new Date();

  today.setHours(0,0,0,0);

  const possibleDays = [];

  for(
    let day=1;
    day<=totalDays;
    day++
  ){

    const date =
      new Date(
        currentYear,
        currentMonth,
        day
      );

    if(date >= today){
      possibleDays.push(day);
    }

  }

  possibleDays.sort(
    () => Math.random() - .5
  );

  const result = {};

  possibleDays
    .slice(0,6)
    .forEach(
      (day,index) => {

        result[day] =
          bookedGirls[
            index %
            bookedGirls.length
          ];

      }
    );

  bookedDates[key] = result;

  return result;
}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

  return date.toLocaleDateString(
    "en-US",
    {
      weekday:"long",
      month:"long",
      day:"numeric"
    }
  );

}


/* =========================
   CALENDAR
========================= */

function renderCalendar(){

  calendarGrid.innerHTML = "";

  monthTitle.textContent =
    months[currentMonth] +
    " " +
    currentYear;

  const firstDay =
    new Date(
      currentYear,
      currentMonth,
      1
    ).getDay();

  const totalDays =
    new Date(
      currentYear,
      currentMonth + 1,
      0
    ).getDate();

  const today = new Date();

  today.setHours(0,0,0,0);

  const booked =
    generateBookedDates();


  for(
    let i=0;
    i<firstDay;
    i++
  ){

    const empty =
      document.createElement("div");

    empty.className =
      "day empty";

    calendarGrid.appendChild(
      empty
    );

  }


  for(
    let day=1;
    day<=totalDays;
    day++
  ){

    const cell =
      document.createElement("div");

    cell.className = "day";


    const number =
      document.createElement("span");

    number.className =
      "day-number";

    number.textContent = day;


    const date =
      new Date(
        currentYear,
        currentMonth,
        day
      );


    if(booked[day]){

      cell.classList.add("booked");


      const img =
        document.createElement("img");

      img.className =
        "day-photo";

      img.src =
        booked[day].photo;

      img.alt =
        booked[day].name;


      const name =
        document.createElement("div");

      name.className =
        "day-girl-name";

      name.textContent =
        booked[day].name;


      const redLine =
        document.createElement("div");

      redLine.className =
        "red-line";


      cell.appendChild(img);
      cell.appendChild(name);
      cell.appendChild(redLine);


      cell.addEventListener(
        "click",
        () => {

          changeTheme("white");

          openBookedDay(
            date,
            booked[day]
          );

        }
      );

    }else{

      cell.classList.add(
        "empty-date"
      );


      cell.addEventListener(
        "click",
        () => {

          changeTheme("red");

          openAvailableGirls(
            date
          );

        }
      );

    }


    cell.appendChild(number);


    if(date < today){

      cell.style.opacity = ".25";
      cell.style.pointerEvents =
        "none";

    }


    calendarGrid.appendChild(cell);

  }

}


/* =========================
   BOOKED DAY
========================= */

function openBookedDay(
  date,
  girl
){

  detailPhoto.src =
    girl.photo;

  detailName.textContent =
    girl.name;

  detailTime.textContent =
    meetingTimes[
      Math.floor(
        Math.random() *
        meetingTimes.length
      )
    ];

  detailDate.textContent =
    formatDate(date);

  detailScreen.classList.add(
    "open"
  );

}


/* =========================
   AVAILABLE GIRLS
========================= */

function openAvailableGirls(
  date
){

  selectedDate = date;
  selectedGirl = null;
  selectedTime = null;

  availableDate.textContent =
    formatDate(date);

  document
    .querySelectorAll(".girl-card")
    .forEach(
      card =>
        card.classList.remove(
          "selected"
        )
    );

  chooseGirlButton.classList.remove(
    "ready"
  );

  girlsScreen.classList.add(
    "open"
  );

}


/* =========================
   GIRL SELECT
========================= */

document
  .querySelectorAll(".girl-card")
  .forEach(
    card => {

      card.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".girl-card")
            .forEach(
              item =>
                item.classList.remove(
                  "selected"
                )
            );

          card.classList.add(
            "selected"
          );

          selectedGirl = {
            name:
              card.dataset.name,

            photo:
              card.dataset.photo
          };

          chooseGirlButton.classList.add(
            "ready"
          );

        }
      );

    }
  );


/* =========================
   CHOOSE TIME
========================= */

chooseGirlButton.addEventListener(
  "click",
  () => {

    if(!selectedGirl) return;

    changeTheme("black");

    selectedGirlName.textContent =
      selectedGirl.name +
      " · " +
      formatDate(selectedDate);

    selectedTime = null;

    document
      .querySelectorAll(".time-button")
      .forEach(
        button =>
          button.classList.remove(
            "selected"
          )
      );

    confirmMeeting.classList.remove(
      "ready"
    );

    girlsScreen.classList.remove(
      "open"
    );

    timeScreen.classList.add(
      "open"
    );

  }
);


/* =========================
   TIME SELECT
========================= */

document
  .querySelectorAll(".time-button")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".time-button")
            .forEach(
              item =>
                item.classList.remove(
                  "selected"
                )
            );

          button.classList.add(
            "selected"
          );

          selectedTime =
            button.textContent;

          confirmMeeting.classList.add(
            "ready"
          );

        }
      );

    }
  );


/* =========================
   CONFETTI
========================= */

function launchConfetti(){

  const container =
    document.getElementById(
      "confetti"
    );

  container.innerHTML = "";

  const colors = [
    "#ff1738",
    "#ffffff",
    "#080808",
    "#ff4d63",
    "#f5f5f5"
  ];


  for(
    let i=0;
    i<100;
    i++
  ){

    const piece =
      document.createElement(
        "div"
      );

    piece.className =
      "confetti-piece";

    piece.style.left =
      Math.random() * 100 + "%";

    piece.style.background =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];

    piece.style.setProperty(
      "--x",
      (Math.random()*400-200) + "px"
    );

    piece.style.setProperty(
      "--duration",
      (1.7 + Math.random()*1.7) + "s"
    );

    piece.style.setProperty(
      "--rotation",
      (Math.random()*360) + "deg"
    );

    piece.style.setProperty(
      "--spin",
      (Math.random()*1200-600) + "deg"
    );

    piece.style.width =
      (5 + Math.random()*6) + "px";

    piece.style.height =
      (8 + Math.random()*10) + "px";

    piece.style.animationDelay =
      (Math.random()*.35) + "s";

    container.appendChild(
      piece
    );

  }


  setTimeout(
    () => {
      container.innerHTML = "";
    },
    4000
  );

}


/* =========================
   GET INSIGHTS
========================= */

confirmMeeting.addEventListener(
  "click",
  () => {

    if(
      !selectedGirl ||
      !selectedDate ||
      !selectedTime
    ){
      return;
    }

    changeTheme("white");

    detailPhoto.src =
      selectedGirl.photo;

    detailName.textContent =
      selectedGirl.name;

    detailTime.textContent =
      selectedTime;

    detailDate.textContent =
      formatDate(selectedDate);


    timeScreen.classList.remove(
      "open"
    );

    detailScreen.classList.add(
      "open"
    );


    /* CONFETTI */

    setTimeout(
      launchConfetti,
      120
    );

  }
);

   BACK BUTTONS

/* =========================
   MONTH NAVIGATION
========================= */

prevMonth.addEventListener(
  "click",
  () => {

    currentMonth--;

    if(currentMonth < 0){

      currentMonth = 11;
      currentYear--;

    }

    changeTheme("red");

    setTimeout(
      () => changeTheme("black"),
      350
    );

    renderCalendar();

  }
);


nextMonth.addEventListener(
  "click",
  () => {

    currentMonth++;

    if(currentMonth > 11){

      currentMonth = 0;
      currentYear++;

    }

    changeTheme("red");

    setTimeout(
      () => changeTheme("black"),
      350
    );

    renderCalendar();

  }
);


/* =========================
   START
========================= */

renderCalendar();

</script>
